name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flake:
    name: Nix flake checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build bundled repo.json package
        run: nix build .#repo-json --print-build-logs

      - name: Build update tool
        run: nix build .#update-repo-json --print-build-logs
